name: Linux validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            package_command: bash scripts/build-linux-release.sh 0.0.0 artifacts/validation linux-x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run quick portable tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.Tests/Libzora.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/portable
      - name: Run quick platform-common tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.Platform.Common.Tests/Libzora.Platform.Common.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/platform-common
      - name: Run quick UI smoke tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.App.Tests/Libzora.App.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/ui
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.name }}
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Build native package
        run: ${{ matrix.package_command }}
      - name: Install and smoke-test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./artifacts/validation/libzora_0.0.0_amd64.deb xvfb
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s /usr/bin/libzora \
            > "$RUNNER_TEMP/libzora-linux.log" 2>&1
          status=$?
          set -e
          if [[ "$status" != 124 ]]; then
            cat "$RUNNER_TEMP/libzora-linux.log"
            echo "Libzora exited before the Linux smoke-test timeout (status $status)." >&2
            exit 1
          fi
      - name: Inspect Linux package metadata
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info artifacts/validation/libzora_0.0.0_amd64.deb
          dpkg-deb --contents artifacts/validation/libzora_0.0.0_amd64.deb | grep 'usr/bin/libzora'
