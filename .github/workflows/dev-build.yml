name: Development Build

run-name: "Development build ${{ github.ref_name }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "留空根据最新稳定版自动推算；也可指定基础版本，例如 1.0.7-dev"
        required: false
        default: ""
        type: string
      platform:
        description: "构建平台；仅 all 会发布完整的开发版 Release"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
permissions:
  contents: write

concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve development version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        uses: actions/github-script@v7
        env:
          BASE_VERSION: ${{ inputs.base_version }}
        with:
          script: |
            let base = process.env.BASE_VERSION?.trim();
            if (!base) {
              const { data: stable } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo
              });
              const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(stable.tag_name);
              if (stable.draft || stable.prerelease || !match) {
                throw new Error(`Invalid stable release: ${stable.tag_name}`);
              }
              base = `${match[1]}.${match[2]}.${BigInt(match[3]) + 1n}-dev`;
              core.info(`Latest stable release: ${stable.tag_name}; development base: ${base}`);
            }
            if (!/^\d+\.\d+\.\d+-dev$/.test(base || '')) {
              throw new Error('base_version must look like 1.0.7-dev');
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const prefix = `${base}.`;
            const numbers = releases.map(r => r.tag_name.replace(/^v/, ''))
              .filter(tag => tag.startsWith(prefix))
              .map(tag => tag.slice(prefix.length))
              .filter(n => /^\d+(?:\.\d+)?$/.test(n))
              .map(n => Number(n.split('.')[0]));
            const next = Math.max(0, ...numbers) + 1;
            const version = `${base}.${next}`;
            core.setOutput('version', version);
            core.info(`Development version: ${version}`);

  validate:
    name: Run tests and dependency audit
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run quick portable tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.Tests/Libzora.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/portable
      - name: Run quick platform-common tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.Platform.Common.Tests/Libzora.Platform.Common.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/platform-common
      - name: Run quick UI smoke tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.App.Tests/Libzora.App.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/ui
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: development-test-diagnostics-validation
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit runtime dependencies
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if dotnet list src/Libzora.Desktop.Linux/Libzora.Desktop.Linux.csproj package \
              --vulnerable --include-transitive; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "NuGet audit failed on attempt $attempt; retrying..." >&2
              sleep $((attempt * 10))
            fi
          done
          echo "NuGet audit failed after three attempts." >&2
          exit 1

  windows:
    name: Build Windows installer package
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    needs: [prepare, validate]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      DEV_VERSION: ${{ needs.prepare.outputs.version }}
      OUTPUT_DIR: ${{ github.workspace }}\artifacts\development-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install release toolchain
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey 安装 Inno Setup 失败：$LASTEXITCODE" }
      - name: Build installer and portable package
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 `
            -Version $env:DEV_VERSION `
            -OutputRoot $env:OUTPUT_DIR
      - uses: actions/upload-artifact@v7
        with:
          name: Libzora-${{ needs.prepare.outputs.version }}-windows
          path: |
            ${{ env.OUTPUT_DIR }}/*.exe
            ${{ env.OUTPUT_DIR }}/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  linux:
    name: Build Linux packages
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEV_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build amd64 packages
        run: bash scripts/build-linux-release.sh "$DEV_VERSION" artifacts/development-linux linux-x64
      - name: Build arm64 packages
        run: bash scripts/build-linux-release.sh "$DEV_VERSION" artifacts/development-linux linux-arm64
      - name: Install and smoke-test amd64 package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "./artifacts/development-linux/libzora_${DEV_VERSION}_amd64.deb" xvfb
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s /usr/bin/libzora \
            > "$RUNNER_TEMP/libzora-linux-development.log" 2>&1
          status=$?
          set -e
          if [[ "$status" != 124 ]]; then
            cat "$RUNNER_TEMP/libzora-linux-development.log"
            echo "Libzora exited before the Linux smoke-test timeout (status $status)." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Libzora-${{ needs.prepare.outputs.version }}-linux
          path: artifacts/development-linux/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    name: Build macOS package (${{ matrix.arch }})
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    needs: [prepare, validate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rid: osx-arm64
            runner: macos-15
          - arch: x64
            rid: osx-x64
            runner: macos-15-intel
    env:
      DEV_VERSION: ${{ needs.prepare.outputs.version }}
      # Icon Composer assets require Xcode 26; the runner defaults to Xcode 16.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LIBZORA_DMG_STYLE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          check-latest: false
          skip-lts-prepass: true
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', '**/packages.lock.json') }}
          restore-keys: |
            nuget-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Check macOS toolchain
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/libzora-toolchain.txt"
          xcrun --sdk macosx --show-sdk-version | tee -a "$RUNNER_TEMP/libzora-toolchain.txt"
          clang --version | tee -a "$RUNNER_TEMP/libzora-toolchain.txt"
          echo "cache-key=$(shasum -a 256 "$RUNNER_TEMP/libzora-toolchain.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache macOS MTP dependencies
        uses: actions/cache@v6
        with:
          path: artifacts/macos-deps
          key: macos-mtp-v1-${{ runner.arch }}-${{ matrix.rid }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('scripts/build-macos-mtp-deps.sh', 'docs/macos-mtp-corresponding-source.md') }}
          restore-keys: |
            macos-mtp-v1-${{ runner.arch }}-${{ matrix.rid }}-
      - name: Run portable tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.Tests/Libzora.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/portable
      - name: Run platform-common tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.Platform.Common.Tests/Libzora.Platform.Common.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/platform-common
      - name: Run UI smoke tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/Libzora.App.Tests/Libzora.App.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger trx
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory artifacts/test-results/ui
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: development-test-diagnostics-${{ matrix.rid }}
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Build macOS package
        shell: bash
        run: bash scripts/build-macos-release.sh "$DEV_VERSION" artifacts/development-macos "${{ matrix.rid }}"
      - name: Verify and smoke-test macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/libzora-smoke"
          mkdir -p "$work"
          dmg="artifacts/development-macos/Libzora-${DEV_VERSION}-${{ matrix.rid }}.dmg"
          hdiutil verify "$dmg"
          mountpoint="$RUNNER_TEMP/libzora-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mountpoint" "$dmg" >/dev/null
          trap 'hdiutil detach "$mountpoint" -force -quiet >/dev/null 2>&1 || true' EXIT
          test -d "$mountpoint/Libzora.app"
          test -L "$mountpoint/Applications"
          test "$(readlink "$mountpoint/Applications")" = "/Applications"
          ditto "$mountpoint/Libzora.app" "$work/Libzora.app"
          hdiutil detach "$mountpoint" >/dev/null
          trap - EXIT
          plutil -lint "$work/Libzora.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$work/Libzora.app/Contents/Info.plist")" = Libzora
          test -s "$work/Libzora.app/Contents/Resources/Assets.car"
          test -s "$work/Libzora.app/Contents/Resources/Libzora.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$work/Libzora.app/Contents/Info.plist")" = Libzora
          iconset="$work/Libzora-fallback.iconset"
          iconutil --convert iconset --output "$iconset" "$work/Libzora.app/Contents/Resources/Libzora.icns"
          test -s "$iconset/icon_512x512@2x.png"
          # macOS 15's CoreUI validator cannot decode Xcode 26 Icon Composer
          # renditions. Verify its fallback icon and signature on older hosts.
          macos_major="$(sw_vers -productVersion | cut -d . -f 1)"
          if (( macos_major >= 26 )); then
            xcrun assetutil -Z "$work/Libzora.app/Contents/Resources/Assets.car"
          else
            printf 'Legacy CoreUI host: checked compiled assets and decoded ICNS fallback.\n'
          fi
          codesign --verify --deep --strict "$work/Libzora.app"
          log="$RUNNER_TEMP/libzora-macos-smoke.log"
          "$work/Libzora.app/Contents/MacOS/Libzora" >"$log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            echo "Libzora exited during the macOS development smoke test." >&2
            exit 1
          fi
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: Libzora-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}
          path: artifacts/development-macos/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish development GitHub Release
    needs: [prepare, windows, linux, macos]
    if: ${{ inputs.platform == 'all' && (github.ref_name == 'dev' || github.ref_name == 'develop' || startsWith(github.ref_name, 'dev/')) }}
    runs-on: ubuntu-24.04
    env:
      DEV_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: v${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Libzora-${{ needs.prepare.outputs.version }}-*
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create development release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/libzora-development-release-notes.md" <<EOF
          ## Libzora development build

          Automated development build **${RELEASE_TAG}** from commit [${GITHUB_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          This is a development version and may contain unfinished or unstable changes.
          EOF

      - name: Create update manifest
        shell: bash
        run: |
          set -euo pipefail
          setup_name="Libzora-${DEV_VERSION}-win-x64-setup.exe"
          checksum_name="SHA256SUMS.txt"
          test -f "artifacts/${setup_name}"
          test -f "artifacts/${checksum_name}"
          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          jq -n \
            --arg tag_name "$RELEASE_TAG" \
            --arg html_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --rawfile body "$RUNNER_TEMP/libzora-development-release-notes.md" \
            --rawfile body_en "$RUNNER_TEMP/libzora-development-release-notes.md" \
            --arg setup_name "$setup_name" \
            --arg setup_url "${download_base}/${setup_name}" \
            --argjson setup_size "$(stat -c%s "artifacts/${setup_name}")" \
            --arg checksum_name "$checksum_name" \
            --arg checksum_url "${download_base}/${checksum_name}" \
            --argjson checksum_size "$(stat -c%s "artifacts/${checksum_name}")" \
            '{
              tag_name: $tag_name,
              html_url: $html_url,
              body: $body,
              body_en: $body_en,
              draft: false,
              prerelease: true,
              assets: [
                { name: $setup_name, browser_download_url: $setup_url, size: $setup_size },
                { name: $checksum_name, browser_download_url: $checksum_url, size: $checksum_size }
              ]
            }' > artifacts/update-manifest.json

      - name: Create GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Libzora $RELEASE_TAG (Development)" \
            --notes-file "$RUNNER_TEMP/libzora-development-release-notes.md" \
            --prerelease
